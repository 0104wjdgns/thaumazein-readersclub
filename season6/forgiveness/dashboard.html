<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>대시보드 — 관계 속 감정의 해소와 용서 · 리더스클럽 6기</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/season6/forgiveness/assets/style.css" />
  <style>
    .dash { max-width: 900px; margin: 0 auto; padding: 48px clamp(20px,5vw,40px) 120px; }
    .dash h1 { font-size: 1.6rem; font-weight: 600; margin: 0 0 6px; }
    .dash .meta { color: var(--ink-soft); font-weight: 300; font-size: 0.95rem; margin: 0 0 34px; }
    .toolbar { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; margin-bottom: 30px; }
    .toolbar button { border: 1px solid var(--hairline); border-radius: 3px; padding: 8px 16px; font-size: 0.95rem; }
    .toolbar button:hover { border-color: var(--theme-main); }
    .qgroup { margin: 0 0 46px; }
    .qgroup > h2 { font-size: 1.15rem; font-weight: 500; color: var(--theme-main); margin: 0 0 4px; }
    .qgroup > .qtext { font-size: 1.05rem; font-weight: 400; margin: 0 0 20px; line-height: 1.5; }
    .ans { padding: 16px 0; border-top: 1px solid var(--hairline); }
    .ans .who { font-size: 0.85rem; color: var(--ink-faint); letter-spacing: 0.06em; margin: 0 0 8px; }
    .ans .txt { font-weight: 300; line-height: 1.75; white-space: pre-wrap; }
    .ans .txt.empty { color: var(--ink-faint); font-style: italic; }
    .gate { max-width: 360px; margin: 18vh auto 0; text-align: center; }
    .gate p { color: var(--ink-soft); font-weight: 300; margin: 0 0 26px; }
    .pw-input { width: 100%; min-height: 52px; padding: 0 16px; border: 1px solid var(--hairline); border-radius: var(--radius-md); background: var(--surface); font-size: 1.05rem; text-align: center; }
    .dash h1, .gate h1 { font-family: var(--font-serif); }
  </style>
</head>
<body>
  <main id="dash" class="dash"></main>
  <script src="/season6/forgiveness/config.js"></script>
  <script src="/season6/forgiveness/assets/topic.js"></script>
  <script>(function(){var t=window.RC_TOPIC;if(t){document.documentElement.style.setProperty("--theme-main",t.theme.main);document.documentElement.style.setProperty("--theme-sub",t.theme.sub);}})();</script>
  <script src="/season6/forgiveness/assets/dashboard.js"></script>
</body>
</html>
